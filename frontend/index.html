<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/x-icon" href="/elder-favicon.ico?v=10" />

    <title>Elder Web</title>

    <script>
      // Aplica o tema salvo antes do React montar (sem piscar). Mesma chave do BotaoTema.
      try {
        if (localStorage.getItem("tema") === "escuro") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
