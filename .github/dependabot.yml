# D7 (2026-10-14): atualizações semanais em PR para development, nunca com merge automático. Minor e patch vêm
# agrupados num PR só por ecossistema. Major é decidido à mão, sem PR automático (ignore em npm e docker, 2026-10-15):
# o Prisma fica na 5.22 por causa do migration_lock.toml e o Node fica na 24 por causa do engines e do Render.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    target-branch: "development"
    open-pull-requests-limit: 5
    groups:
      minor-e-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    target-branch: "development"
    open-pull-requests-limit: 5
    groups:
      minor-e-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.5 exige ESLint 9 ou 10; o frontend usa ESLint 8 (o npm ci do PR dá ERESOLVE).
      - dependency-name: "eslint-plugin-react-refresh"
        versions: [">=0.5.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "development"
    open-pull-requests-limit: 5
    groups:
      minor-e-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    target-branch: "development"
    open-pull-requests-limit: 5
    groups:
      minor-e-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
