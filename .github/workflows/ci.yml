name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# O workflow só lê o repositório (D7, 2026-10-14): o GITHUB_TOKEN não escreve em nada.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Só dependências de produção. critical, não high: os 4 avisos altos de @grpc/grpc-js via firebase seguem aceitos.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Só dependências de produção, maior rigor (0 avisos em 2026-10-14): qualquer aviso novo barra o CI.
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run lint
      - run: npx prisma validate
        env:
          DATABASE_URL: "sqlserver://localhost:14330;database=elder_web;user=sa;password=fake;encrypt=true;trustServerCertificate=true"
      - run: npm run test:coverage
      - run: npm run build
      - name: Build da imagem Docker do backend
        working-directory: .
        run: docker build -t elder-web-backend:ci ./backend
