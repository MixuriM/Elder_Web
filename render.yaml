services:
  - type: web
    name: elder-web-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # migrate deploy NÃO entra aqui: o plano free do Render mata o container se
    # ele não abrir a porta em ~30s, e migrate deploy sozinho já consome quase
    # esse tempo todo conectando no Azure. Migrations são aplicadas manualmente
    # de uma máquina local (DATABASE_URL apontando pro Azure + `npx prisma
    # migrate deploy`) antes de cada deploy que tenha migration nova.
    dockerCommand: npm start
    healthCheckPath: /health
    envVars:
      # production: o Express não imprime stack em resposta de erro e libs de produção desligam modos de
      # desenvolvimento. Seguro porque o Dockerfile compila no build (devDependencies já instaladas) e o
      # runtime só roda `npm start` (node dist/index.js). Vale só para o serviço do Render.
      - key: NODE_ENV
        value: production
      # TRUST_PROXY_SALTOS (não é segredo): quantos proxies o Express pula no X-Forwarded-For para achar o IP do
      # cliente (backend/src/app.ts), inteiro de 0 a 3; ausente no código vale 1. O Render tem mais de um proxy na
      # frente do serviço: 3 foi medido em produção em 2026-10-15 (com 1 e com 2 o limite por IP de /auth/sync nunca
      # disparou). Usar o menor valor que dá 429; alto demais deixa o cliente forjar o IP. Refazer o teste do item 5
      # de docs/checklist-seguranca-producao.md antes de mudar ou se o Render mudar a infraestrutura.
      - key: TRUST_PROXY_SALTOS
        value: "3"
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # Origem liberada no CORS (backend/src/app.ts). Sem essa var o CORS cai
      # no fallback localhost:5173 e bloqueia o frontend de produção.
      - key: FRONTEND_URL
        sync: false
      # Aviso de emergência (POST /emergencia/avisar): e-mail por API HTTPS. Sem as três, só o aviso falha (503).
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_REMETENTE_NOME
        sync: false
      - key: EMAIL_REMETENTE_ENDERECO
        sync: false
