services:
  - type: web
    name: elder-web-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # preDeployCommand é recurso pago no Render — no plano free, migrate deploy
    # entra encadeado aqui mesmo, com sh -c explícito pra garantir que o && seja
    # interpretado como shell (sem isso o Render não encadeia os comandos certo).
    dockerCommand: sh -c "npx prisma migrate deploy && npm start"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
