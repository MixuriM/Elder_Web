<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 656" width="960" height="656" role="img" aria-labelledby="t-arq d-arq" font-family='system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
<title id="t-arq">Arquitetura do Elder Web</title>
<desc id="d-arq">O navegador carrega o frontend React na Vercel, faz login no Firebase Auth e chama a API Express hospedada no Render com o ID Token. A API valida o token no Firebase e lê e grava no Azure SQL Database. Só o aviso de emergência usa um serviço de e-mail transacional.</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3B3590" flood-opacity="0.14"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#475569"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#B45309"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="655" rx="16" fill="#F6F5FF" stroke="#DAD7F5" stroke-width="1"/>
<text x="160" y="52" font-size="15" font-weight="700" fill="#3B3590" text-anchor="middle">Cliente</text><rect x="48" y="62" width="224" height="3" rx="1.5" fill="#5F56EC" opacity="0.35"/><text x="480" y="52" font-size="15" font-weight="700" fill="#3B3590" text-anchor="middle">Aplicação</text><rect x="368" y="62" width="224" height="3" rx="1.5" fill="#5F56EC" opacity="0.35"/><text x="800" y="52" font-size="15" font-weight="700" fill="#3B3590" text-anchor="middle">Dados e serviços</text><rect x="688" y="62" width="224" height="3" rx="1.5" fill="#5F56EC" opacity="0.35"/><path d="M160 200 L160 104 Q160 92 172 92 L788 92 Q800 92 800 104 L800 120" fill="none" stroke="#475569" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M160 288 L160 368" fill="none" stroke="#475569" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M272 244 L368 244" fill="none" stroke="#475569" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M592 188 L688 188" fill="none" stroke="#475569" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M592 272 L688 272" fill="none" stroke="#475569" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M432 320 L432 432 Q432 444 444 444 L688 444" fill="none" stroke="#B45309" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#ahA)"/><rect x="48" y="200" width="224" height="88" rx="12" fill="#E9E7FF" stroke="#5F56EC" stroke-width="1.5" filter="url(#sh)"/><text x="68" y="234" font-size="17" font-weight="700" fill="#3B3590" text-anchor="start">Navegador</text><text x="68" y="258" font-size="14" font-weight="400" fill="#1F2544" text-anchor="start">React e Vite</text><rect x="48" y="368" width="224" height="88" rx="12" fill="#E9E7FF" stroke="#5F56EC" stroke-width="1.5" filter="url(#sh)"/><text x="68" y="402" font-size="17" font-weight="700" fill="#3B3590" text-anchor="start">Vercel</text><text x="68" y="426" font-size="14" font-weight="400" fill="#1F2544" text-anchor="start">hospeda o frontend</text><rect x="368" y="184" width="224" height="136" rx="12" fill="#5F56EC" stroke="#3B3590" stroke-width="1.5" filter="url(#sh)"/><text x="388" y="218" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">API Express</text><text x="388" y="242" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="start">Node.js e TypeScript</text><text x="388" y="264" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="start">Render, runtime Docker</text><text x="388" y="286" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="start">autoriza por vínculo</text><rect x="688" y="120" width="224" height="80" rx="12" fill="#E9E7FF" stroke="#5F56EC" stroke-width="1.5" filter="url(#sh)"/><text x="708" y="154" font-size="17" font-weight="700" fill="#3B3590" text-anchor="start">Firebase Auth</text><text x="708" y="178" font-size="14" font-weight="400" fill="#1F2544" text-anchor="start">e-mail e senha, Google</text><rect x="688" y="240" width="224" height="112" rx="12" fill="#D5F3EE" stroke="#0F766E" stroke-width="1.5" filter="url(#sh)"/><text x="708" y="274" font-size="17" font-weight="700" fill="#0F766E" text-anchor="start">Azure SQL Database</text><text x="708" y="298" font-size="14" font-weight="400" fill="#1F2544" text-anchor="start">SQL Server</text><text x="708" y="320" font-size="14" font-weight="400" fill="#1F2544" text-anchor="start">TDE e TLS 1.2 ou superior</text><rect x="688" y="400" width="224" height="88" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#sh)"/><text x="708" y="434" font-size="17" font-weight="700" fill="#B45309" text-anchor="start">E-mail transacional</text><text x="708" y="458" font-size="14" font-weight="400" fill="#1F2544" text-anchor="start">serviço externo opcional</text><circle cx="160" cy="328" r="12" fill="#5F56EC"/><text x="160" y="332.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="480" cy="92" r="12" fill="#5F56EC"/><text x="480" y="96.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><circle cx="320" cy="244" r="12" fill="#5F56EC"/><text x="320" y="248.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><circle cx="640" cy="188" r="12" fill="#5F56EC"/><text x="640" y="192.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><circle cx="640" cy="272" r="12" fill="#5F56EC"/><text x="640" y="276.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><rect x="466" y="432" width="188" height="24" rx="11" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/><text x="560" y="448.5" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">só no aviso de emergência</text><line x1="48" y1="520" x2="912" y2="520" stroke="#DAD7F5" stroke-width="1"/><circle cx="60" cy="552" r="12" fill="#5F56EC"/><text x="60" y="556.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="82" y="557" font-size="14" font-weight="400" fill="#1F2544" text-anchor="start">carrega o site (Vercel)</text><circle cx="60" cy="588" r="12" fill="#5F56EC"/><text x="60" y="592.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="82" y="593" font-size="14" font-weight="400" fill="#1F2544" text-anchor="start">login pelo Firebase Web SDK</text><circle cx="60" cy="624" r="12" fill="#5F56EC"/><text x="60" y="628.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="82" y="629" font-size="14" font-weight="400" fill="#1F2544" text-anchor="start">chamadas à API com ID Token</text><circle cx="492" cy="552" r="12" fill="#5F56EC"/><text x="492" y="556.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="514" y="557" font-size="14" font-weight="400" fill="#1F2544" text-anchor="start">a API valida o token (Admin SDK)</text><circle cx="492" cy="588" r="12" fill="#5F56EC"/><text x="492" y="592.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="514" y="593" font-size="14" font-weight="400" fill="#1F2544" text-anchor="start">a API lê e grava no banco via Prisma, conexão criptografada</text>
</svg>
