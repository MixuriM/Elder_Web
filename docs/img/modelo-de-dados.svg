<title id="t-er">Modelo de dados do Elder Web</title>
<desc id="d-er">Sete entidades. Usuario se liga a Vinculo por idoso_id e por vinculado_id, e a Evento, Medicamento, RegistroSaude e RegistroAlimentar por idoso_id. Medicamento se liga a RegistroDoseMedicamento por medicamento_id. Cada ligação é de um Usuario para muitos registros.</desc>
