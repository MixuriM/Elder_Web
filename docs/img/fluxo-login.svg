EC" stroke-width="2" filter="url(#sh)"/><text x="284" y="709" font-size="14" font-weight="700" fill="#3B3590" text-anchor="start">Chamadas seguintes: o Frontend manda o ID Token</text><text x="284" y="731" font-size="14" font-weight="400" fill="#1F2544" text-anchor="start">e o middleware requireAuth resolve o id interno do Usuario</text><rect x="44" y="32" width="136" height="48" rx="12" fill="#5F56EC" stroke="#3B3590" stroke-width="1.5" filter="url(#sh)"/><text x="112" y="62" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Usuário</text><rect x="228" y="32" width="136" height="48" rx="12" fill="#5F56EC" stroke="#3B3590" stroke-width="1.5" filter="url(#sh)"/><text x="296" y="62" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Frontend</text><rect x="412" y="32" width="136" height="48" rx="12" fill="#5F56EC" stroke="#3B3590" stroke-width="1.5" filter="url(#sh)"/><text x="480" y="62" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Firebase Auth</text><rect x="596" y="32" width="136" height="48" rx="12" fill="#5F56EC" stroke="#3B3590" stroke-width="1.5" filter="url(#sh)"/><text x="664" y="62" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">API</text><rect x="780" y="32" width="136" height="48" rx="12" fill="#0F766E" stroke="#0F766E" stroke-width="1.5" filter="url(#sh)"/><text x="848" y="62" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">SQL Server</text><rect x="143.5" y="124" width="121" height="40" rx="11" fill="#FFFFFF" stroke="#B8B4E6" stroke-width="1"/><text x="204" y="140.5" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">e-mail e senha</text><text x="204" y="156.5" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">ou conta Google</text><circle cx="112" cy="144" r="12" fill="#5F56EC"/><text x="112" y="148.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="348" y="196" width="80" height="24" rx="11" fill="#FFFFFF" stroke="#B8B4E6" stroke-width="1"/><text x="388" y="212.5" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">autentica</text><circle cx="296" cy="208" r="12" fill="#5F56EC"/><text x="296" y="212.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><rect x="331" y="260" width="114" height="24" rx="11" fill="#FFFFFF" stroke="#B8B4E6" stroke-width="1"/><text x="388" y="276.5" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">ID Token (JWT)</text><circle cx="480" cy="272" r="12" fill="#5F56EC"/><text x="480" y="276.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="419.5" y="316" width="121" height="40" rx="11" fill="#FFFFFF" stroke="#B8B4E6" stroke-width="1"/><text x="480" y="332.5" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">POST /auth/sync</text><text x="480" y="348.5" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">com o ID Token</text><circle cx="296" cy="336" r="12" fill="#5F56EC"/><text x="296" y="340.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><rect x="508.5" y="380" width="127" height="40" rx="11" fill="#FFFFFF" stroke="#B8B4E6" stroke-width="1"/><text x="572" y="396.5" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">verifica o token</text><text x="572" y="412.5" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">(Admin SDK)</text><circle cx="664" cy="400" r="12" fill="#5F56EC"/><text x="664" y="404.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><rect x="692.5" y="444" width="127" height="40" rx="11" fill="#FFFFFF" stroke="#B8B4E6" stroke-width="1"/><text x="756" y="460.5" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">busca Usuario</text><text x="756" y="476.5" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">por firebase_uid</text><ci