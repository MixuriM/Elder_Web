<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 808" width="960" height="808" role="img" aria-labelledby="t-login d-login" font-family='system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
<title id="t-login">Fluxo de login e POST /auth/sync</title>
<desc id="d-login">Cinco participantes: Usuário, Frontend, Firebase Auth, API e SQL Server. 1: o usuário informa e-mail e senha ou usa a conta Google. 2: o frontend autentica no Firebase Auth. 3: o Firebase devolve o ID Token (JWT). 4: o frontend chama POST /auth/sync com o token. 5: a API verifica o token no Firebase com o Admin SDK. 6: a API busca o Usuario no SQL Server por firebase_uid. 7: se não existe, cria o Usuario com o tipo_perfil escolhido no cadastro. 8: a API devolve os dados do usuário ao frontend. 9: nas chamadas seguintes o frontend manda o ID Token e o middleware requireAuth resolve o id interno do Usuario.</desc>
<defs>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3B3590" flood-opacity="0.14"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#475569"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#B45309"/></marker>
</defs>
